name: Update recipe database

on:
  push:
    branches:
      - main
    paths:
      - unitools-recipes-v1.json
      - database/**
      - .github/workflows/update-recipe-database.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-recipe-database
  cancel-in-progress: false

jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed recipe data
        uses: actions/checkout@v4

      - name: Validate data and generate a full-replacement import
        run: |
          set -euo pipefail
          node --test database/build-import.test.mjs
          node database/build-import.mjs \
            unitools-recipes-v1.json \
            "$RUNNER_TEMP/pantrysmart-recipes.sql" \
            --replace

      - name: Transfer import over SSH, update MySQL on STRATO, and verify counts
        env:
          STRATO_DB_HOST: ${{ secrets.STRATO_DB_HOST }}
          STRATO_DB_NAME: ${{ secrets.STRATO_DB_NAME }}
          STRATO_DB_USER: ${{ secrets.STRATO_DB_USER }}
          STRATO_DB_PASSWORD: ${{ secrets.STRATO_DB_PASSWORD }}
          STRATO_SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          STRATO_SSH_USERNAME: ${{ secrets.STRATO_SSH_USERNAME }}
          STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          for secret_name in \
            STRATO_DB_HOST STRATO_DB_NAME STRATO_DB_USER STRATO_DB_PASSWORD \
            STRATO_SSH_HOST STRATO_SSH_USERNAME STRATO_SSH_PRIVATE_KEY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Required repository secret is missing: $secret_name"
              exit 1
            fi
          done

          if ! command -v ssh >/dev/null 2>&1 \
            || ! command -v scp >/dev/null 2>&1 \
            || ! command -v ssh-keygen >/dev/null 2>&1; then
            echo "The GitHub runner does not have the required OpenSSH client tools."
            exit 1
          fi

          key_file="$RUNNER_TEMP/strato-ssh-key"
          known_hosts_file="$RUNNER_TEMP/strato-known-hosts"
          mysql_option_file="$RUNNER_TEMP/strato-mysql.cnf"
          ssh_error_file="$RUNNER_TEMP/strato-ssh-error"
          remote_tmp=""
          ssh_destination="$STRATO_SSH_USERNAME@$STRATO_SSH_HOST"
          ssh_options=()

          cleanup() {
            if [ -n "$remote_tmp" ]; then
              if ! ssh "${ssh_options[@]}" "$ssh_destination" \
                "rm -rf -- '$remote_tmp'" >/dev/null 2>&1; then
                echo "Warning: the temporary STRATO import directory could not be removed."
              fi
            fi
            rm -f "$key_file" "$known_hosts_file" "$mysql_option_file" "$ssh_error_file"
          }
          trap cleanup EXIT

          umask 077
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$key_file"
          if ! ssh-keygen -y -P "" -f "$key_file" >/dev/null 2>"$ssh_error_file"; then
            if ! grep -q '^PuTTY-User-Key-File-' "$key_file"; then
              echo "The SSH private key is invalid, encrypted, or not in a supported format. Use an unencrypted OpenSSH private key or PuTTY .ppk key."
              exit 1
            fi

            sudo apt-get update
            sudo apt-get install --yes putty-tools
            converted_key_file="$RUNNER_TEMP/strato-ssh-key-openssh"
            if ! puttygen "$key_file" -O private-openssh -o "$converted_key_file" \
              </dev/null 2>"$ssh_error_file"; then
              echo "Could not convert the PuTTY private key. It may be passphrase-protected; use an unencrypted deployment key."
              exit 1
            fi
            chmod 600 "$converted_key_file"
            mv "$converted_key_file" "$key_file"

            if ! ssh-keygen -y -P "" -f "$key_file" >/dev/null 2>"$ssh_error_file"; then
              echo "The converted SSH private key is invalid. Check the key format and try again."
              exit 1
            fi
          fi
          printf '%s\n' \
            '558790779.ssh.w1.strato.hosting ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbBMvvDjN4IP04VAZlDH42A+HL25ifeIK9CorAvaMA/' \
            > "$known_hosts_file"

          node --input-type=module -e '
          import { writeFile } from "node:fs/promises";

          const fields = {
            host: process.env.STRATO_DB_HOST,
            user: process.env.STRATO_DB_USER,
            password: process.env.STRATO_DB_PASSWORD,
            database: process.env.STRATO_DB_NAME,
          };
          if (Object.values(fields).some((value) => /[\r\n]/.test(value))) {
            throw new Error("Database connection secrets contain unsupported line breaks.");
          }

          const contents = "[client]\n" + Object.entries(fields)
            .map(([key, value]) => `${key}="${value.replaceAll("\\", "\\\\").replaceAll("\"", "\\\"")}"\n`)
            .join("");
          await writeFile(`${process.env.RUNNER_TEMP}/strato-mysql.cnf`, contents, { mode: 0o600 });
          '

          ssh_options=(
            -p 22
            -i "$key_file"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
            -o ConnectTimeout=10
          )

          expected_counts="$(node --input-type=module -e '
          import { readFile } from "node:fs/promises";
          const data = JSON.parse(await readFile("unitools-recipes-v1.json", "utf8"));
          const languages = Object.keys(data.countries[0].name).length;
          const ingredientCount = data.recipes.reduce((count, recipe) => count + recipe.ingredients.length, 0);
          const stepCount = data.recipes.reduce((count, recipe) => count + recipe.steps.length, 0);
          const dietCount = data.recipes.reduce((count, recipe) => count + recipe.diets.length, 0);
          console.log([
            1,
            data.countries.length,
            data.countries.length * languages,
            data.recipes.length,
            data.recipes.length * languages,
            dietCount,
            ingredientCount,
            ingredientCount * languages,
            stepCount,
            stepCount * languages,
          ].join("\t"));
          ')"

          if ! remote_tmp="$(ssh "${ssh_options[@]}" "$ssh_destination" \
            'umask 077 && mktemp -d .pantrysmart-import.XXXXXX' \
            2>"$ssh_error_file")"; then
            echo "Could not create a temporary import directory over STRATO SSH. Check the SSH secrets, public-key setup, and account shell access."
            exit 1
          fi

          if [[ ! "$remote_tmp" =~ ^\./\.pantrysmart-import\.[A-Za-z0-9]+$ ]]; then
            echo "STRATO returned an unexpected temporary directory path; refusing to upload."
            exit 1
          fi

          if ! scp \
            -P 22 \
            -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" \
            -o ConnectTimeout=10 \
            "$RUNNER_TEMP/pantrysmart-recipes.sql" \
            "$mysql_option_file" \
            "$ssh_destination:$remote_tmp/" \
            2>"$ssh_error_file"; then
            echo "Could not securely upload the import to STRATO. Check SSH access and the account's write permissions."
            exit 1
          fi

          if ! actual_counts="$(ssh "${ssh_options[@]}" "$ssh_destination" \
            "mysql --defaults-extra-file='$remote_tmp/strato-mysql.cnf' --connect-timeout=10 --default-character-set=utf8mb4 --binary-mode --batch --skip-column-names < '$remote_tmp/pantrysmart-recipes.sql'" \
            2>"$ssh_error_file")"; then
            if grep -Eiq 'Access denied for user' "$ssh_error_file"; then
              echo "MySQL on STRATO rejected the database credentials or grants. Check the recipe repository STRATO_DB_* secrets and database permissions."
            elif grep -Eiq 'Unknown database' "$ssh_error_file"; then
              echo "MySQL on STRATO could not find the configured database."
            elif grep -Eiq 'command not found|mysql: not found' "$ssh_error_file"; then
              echo "The STRATO SSH account could not run the MySQL client."
            else
              echo "The import command failed on STRATO. Check the MySQL client and database permissions."
            fi
            exit 1
          fi

          if [ "$actual_counts" != "$expected_counts" ]; then
            echo "Database update completed, but table row counts do not match the committed recipe dataset."
            exit 1
          fi

          printf 'Database now mirrors the committed dataset: %s recipes, %s countries, %s ingredients, and %s steps.\n' \
            "$(cut -f4 <<< "$actual_counts")" \
            "$(cut -f2 <<< "$actual_counts")" \
            "$(cut -f7 <<< "$actual_counts")" \
            "$(cut -f9 <<< "$actual_counts")"
